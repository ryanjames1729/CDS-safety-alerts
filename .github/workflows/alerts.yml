name: Safety alerts

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour when GitHub is busiest
    # and starts scheduled runs latest. Each run then keeps polling NWS once a
    # minute for about 4 minutes, so warnings are picked up quickly.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        default: poll
        options:
          - poll
          - test-message
          - morning-brief
          - evening-brief

permissions:
  contents: write # to save what has already been reported on the alert-state branch

concurrency:
  group: safety-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
      STATE_BRANCH: alert-state
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        run: |
          mkdir -p .state
          status=0
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --quiet --depth=1 origin "$STATE_BRANCH"
            git show FETCH_HEAD:state.json > .state/state.json
          elif [ "$status" -ne 2 ]; then
            echo "Could not check for saved state (git exit $status)"
            exit 1
          fi
          if [ -f .state/state.json ]; then sha256sum < .state/state.json > .state/before; fi

      - name: Run monitor
        env:
          ACTION: ${{ inputs.action || 'poll' }}
        run: |
          case "$ACTION" in
            test-message)  python3 -m safety_alerts --test-message ;;
            morning-brief) python3 -m safety_alerts --state .state/state.json --brief morning ;;
            evening-brief) python3 -m safety_alerts --state .state/state.json --brief evening ;;
            *)             python3 -m safety_alerts --state .state/state.json --loop-seconds 240 --interval 60 ;;
          esac

      - name: Save state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -f .state/state.json ] || exit 0
          if [ -f .state/before ] && [ "$(sha256sum < .state/state.json)" = "$(cat .state/before)" ]; then
            exit 0
          fi
          work="$(mktemp -d)"
          cp .state/state.json "$work/state.json"
          cd "$work"
          git init --quiet --initial-branch "$STATE_BRANCH"
          git add state.json
          git -c user.name="safety-alerts" -c user.email="safety-alerts@users.noreply.github.com" \
            commit --quiet --message "Update alert state"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$STATE_BRANCH"
