# Safety alert monitor settings.
# Edit this file on GitHub and commit; the next scheduled run picks it up.

[site]
name = "Carolina Day School"
county = "Buncombe County"
# Campus location. Used to decide whether a warning polygon covers campus and
# to pull the point forecast. To change: right-click the spot in Google Maps
# and copy the coordinates.
latitude = 35.523776
longitude = -82.529897
timezone = "America/New_York"

[nws]
# NWS zone and county codes to watch. NCZ053 = Buncombe forecast zone,
# NCC021 = Buncombe County (used by tornado / thunderstorm / flood warnings).
zones = ["NCZ053", "NCC021"]
# NWS asks API users to identify themselves; adding a contact email is polite.
user_agent = "school-safety-alerts/1.0"

[chat]
# Added to "act now" alerts so everyone in the space is notified.
# Use "" to turn pings off.
mention = "<users/all>"
# Set to true once the /update and /help commands are set up (see chat-app/),
# so the guide tells people about them.
commands = false

[tiers]
# ACT NOW: posted immediately with a ping.
# Warnings drawn as a polygon (tornado, severe thunderstorm, flash flood) only
# ping when campus is inside the polygon, except those in always_ping.
act_now = [
  "Tornado Warning",
  "Severe Thunderstorm Warning",
  "Flash Flood Warning",
  "Extreme Wind Warning",
  "Snow Squall Warning",
  "Winter Storm Warning",
  "Ice Storm Warning",
  "Blizzard Warning",
  "Hurricane Warning",
  "Tropical Storm Warning",
  "Civil Danger Warning",
  "Civil Emergency Message",
  "Shelter In Place Warning",
  "Evacuation Immediate",
  "Law Enforcement Warning",
  "Hazardous Materials Warning",
  "Fire Warning",
  "Earthquake Warning",
  "Radiological Hazard Warning",
  "Nuclear Power Plant Warning",
  "Local Area Emergency",
  "911 Telephone Outage",
]
always_ping = ["Tornado Warning"]

# HEADS UP: posted immediately, no ping.
heads_up = [
  "Tornado Watch",
  "Severe Thunderstorm Watch",
  "Flood Watch",
  "Flash Flood Watch",
  "Flood Warning",
  "Flood Advisory",
  "Winter Storm Watch",
  "Winter Weather Advisory",
  "Freezing Rain Advisory",
  "Extreme Cold Warning",
  "Extreme Cold Watch",
  "Cold Weather Advisory",
  "Wind Chill Warning",
  "Wind Chill Advisory",
  "High Wind Warning",
  "High Wind Watch",
  "Wind Advisory",
  "Dense Fog Advisory",
  "Freezing Fog Advisory",
  "Extreme Heat Warning",
  "Extreme Heat Watch",
  "Excessive Heat Warning",
  "Heat Advisory",
  "Hurricane Watch",
  "Tropical Storm Watch",
  "Red Flag Warning",
  "Air Quality Alert",
  "Dense Smoke Advisory",
  "Special Weather Statement",
]

# Never posted and left out of the briefs.
ignore = []
# Anything not listed above: "Severe"/"Extreme" alerts are treated as heads up,
# everything else appears in the daily brief only.

[parkway]
enabled = true
url = "https://www.nps.gov/blri/planyourvisit/roadclosures.htm"
# The stretch of Parkway that works as a through route around Asheville, from
# one public road access to another:
#   375.7  Ox Creek / Elk Mountain Rd (Bull Gap, toward Weaverville)
#   377.4  Town Mountain Rd (Craven Gap)
#   382.8  US-70 Tunnel Rd
#   384.7  US-74A (I-40 exit 53A)
#   388.8  US-25 Hendersonville Rd (nearest campus)
#   393.6  NC-191 Brevard Rd
# Sections beyond these (Craggy Gardens and Mount Mitchell to the north,
# Mount Pisgah to the south) are left out. To extend south to the NC-151
# access, set milepost_max = 405.5.
milepost_min = 375.7
milepost_max = 393.6

[ncdot]
# NCDOT DriveNC road closures, incidents and Snow & Ice road conditions.
# Needs the NCDOT_API_KEY repository secret; without it this source is skipped.
enabled = true
county = "Buncombe"
# Full closures always get their own message. Other crashes and incidents only
# do at these severities; everything else is left out.
incident_severities = ["Major"]
# In the briefs, closures older than this are counted but not listed one by one.
list_days = 7

[briefs]
# Both briefs are only sent when there is something to flag: an active act-now
# or heads-up alert, snow or ice in the forecast, or freezing temperatures with
# precipitation. On an ordinary day nothing is posted.
# Days: 0 = Monday ... 6 = Sunday.
# Morning brief, in time for a closure or delay decision.
morning_time = "05:00"
morning_days = [0, 1, 2, 3, 4]
# Evening outlook for the next morning.
evening_time = "19:00"
evening_days = [6, 0, 1, 2, 3]
# How late a brief may still be sent if the scheduler runs behind.
max_late_minutes = 180

[health]
# Post a notice when a data source has been unreachable this long.
notify_after_minutes = 15
